<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MiniScreen · Classic</title>
  <style>
    :root { --time-color: #63e6dc; --date-color: #c7d0df; --background-color: #000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--background-color); }
    body { font-family: sans-serif; }
    #background { position: absolute; left: 0; top: 0; background-repeat: no-repeat; background-size: 100% 100%; }
    #shade { position: absolute; inset: 0; background: black; opacity: .45; }
    .label { position: absolute; margin: 0; white-space: nowrap; line-height: 1.2; transform: translate(-50%, -50%); text-align: center; }
    #time { color: var(--time-color); font-variant-numeric: tabular-nums; font-weight: 400; }
    #date { color: var(--date-color); }
  </style>
</head>
<body>
  <div id="background"></div><div id="shade"></div>
  <div class="label" id="time">--:--</div><div class="label" id="date"></div>
  <script>
    const time = document.getElementById('time');
    const date = document.getElementById('date');
    const background = document.getElementById('background');
    const shade = document.getElementById('shade');
    let fontUrl = '', last = null, customFont = null, imageUrl = '', image = null, animation = 0, lastFrame = 0;
    const pan = {
      u: .5, v: .5, angle: .63, target: .63, last: -1, zoom: -1, pauseUntil: 0, externalPause: 0, nextTurn: 0, turn: 0,
      reset() { this.u = this.v = .5; this.angle = this.target = .63; this.last = -1; this.zoom = -1; this.pauseUntil = this.nextTurn = 0; this.turn = 0; },
      random() { const n = Math.sin(++this.turn * 12.9898 + 78.233) * 43758.5453; return n - Math.floor(n); },
      update(now, zoom, speed, moving, iw, ih, w, h, extra, scale) {
        const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
        if (this.zoom !== -1 && this.zoom !== zoom) this.pauseUntil = now + 1000;
        this.zoom = zoom;
        const minU = Math.min(.5, (w / 2 + extra) / iw), minV = Math.min(.5, (h / 2 + extra) / ih);
        this.u = clamp(this.u, minU, 1 - minU); this.v = clamp(this.v, minV, 1 - minV);
        const dt = this.last < 0 ? 0 : clamp((now - this.last) / 1000, 0, .1); this.last = now;
        if (!moving || now < this.externalPause || now < this.pauseUntil) { this.nextTurn = now + 4000; return; }
        if (now >= this.nextTurn) { this.target = this.angle + (this.random() - .5) * Math.PI; this.nextTurn = now + 4000 + this.random() * 6000; }
        const pixels = speed * scale, x = this.u * iw, y = this.v * ih;
        const left = minU * iw, right = (1 - minU) * iw, top = minV * ih, bottom = (1 - minV) * ih;
        const look = Math.max(20 * scale, pixels * 1.5);
        let sx = Math.cos(this.target), sy = Math.sin(this.target);
        if (right - left > 1) { sx += Math.max(0, 1 - (x - left) / look) * 2; sx -= Math.max(0, 1 - (right - x) / look) * 2; }
        if (bottom - top > 1) { sy += Math.max(0, 1 - (y - top) / look) * 2; sy -= Math.max(0, 1 - (bottom - y) / look) * 2; }
        const wanted = Math.atan2(sy, sx), delta = Math.atan2(Math.sin(wanted - this.angle), Math.cos(wanted - this.angle));
        this.angle += clamp(delta, -1.2 * dt, 1.2 * dt);
        let vx = Math.cos(this.angle), vy = Math.sin(this.angle);
        if (right - left <= 1) { vx = 0; vy = vy < 0 ? -1 : 1; }
        if (bottom - top <= 1) { vy = 0; vx = vx < 0 ? -1 : 1; }
        const nx = x + vx * pixels * dt, ny = y + vy * pixels * dt;
        if (nx < left || nx > right) { this.angle = Math.PI - this.angle; this.target = this.angle; }
        if (ny < top || ny > bottom) { this.angle = -this.angle; this.target = this.angle; }
        this.u = clamp(nx / iw, minU, 1 - minU); this.v = clamp(ny / ih, minV, 1 - minV);
      }
    };
    function drawBackground(now) {
      if (!last || !image || !image.naturalWidth || !image.naturalHeight) return;
      const d = last, s = d.settings, w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
      if (!w || !h) return;
      const ratio = window.devicePixelRatio || 1, scale = Math.min(d.width, d.height) / 340 / ratio;
      const extra = s.shifting && s.imageFit !== 'contain' ? s.shiftRange * scale : 0;
      let k = s.imageFit === 'contain' ? Math.min(w / image.naturalWidth, h / image.naturalHeight)
        : Math.max((w + 2 * extra) / image.naturalWidth, (h + 2 * extra) / image.naturalHeight);
      if (s.imageFit === 'window') k *= s.windowZoom / 100;
      const iw = image.naturalWidth * k, ih = image.naturalHeight * k;
      let x = (w - iw) / 2, y = (h - ih) / 2;
      if (s.imageFit === 'window') {
        pan.update(performance.now(), s.windowZoom, s.windowSpeed || 20,
          d.running && s.windowMotion && !document.hidden, iw, ih, w, h, extra, scale);
        x = w / 2 - pan.u * iw; y = h / 2 - pan.v * ih;
      }
      if (!s.shiftBackground) { x -= d.shiftX * scale; y -= d.shiftY * scale; }
      if (s.imageFit !== 'contain') { x = Math.max(w - iw, Math.min(0, x)); y = Math.max(h - ih, Math.min(0, y)); }
      background.style.width = iw + 'px'; background.style.height = ih + 'px';
      background.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
    function animateBackground(now) {
      animation = 0;
      if (document.hidden || !last || !last.running || last.settings.imageFit !== 'window' || !last.settings.windowMotion || !imageUrl) return;
      if (now - lastFrame >= 33) { drawBackground(Date.now()); lastFrame = now; }
      animation = requestAnimationFrame(animateBackground);
    }
    function refreshMotion() {
      if (animation) { cancelAnimationFrame(animation); animation = 0; }
      drawBackground(Date.now());
      if (!document.hidden && last && last.running && last.settings.imageFit === 'window' && last.settings.windowMotion && imageUrl)
        animation = requestAnimationFrame(animateBackground);
    }
    function fit(el, configuredSize, x, y) {
      const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
      el.style.fontSize = (configuredSize * Math.min(w, h) / 340) + 'px';
      const box = el.getBoundingClientRect();
      const factor = Math.min(1, (w - 6) / Math.max(1, box.width), (h - 6) / Math.max(1, box.height));
      el.style.fontSize = (configuredSize * Math.min(w, h) / 340 * factor) + 'px';
      const next = el.getBoundingClientRect();
      const px = Math.max(next.width / 2 + 2, Math.min(w - next.width / 2 - 2, w * x / 100));
      const py = Math.max(next.height / 2 + 2, Math.min(h - next.height / 2 - 2, h * y / 100));
      el.style.left = px + 'px'; el.style.top = py + 'px';
    }
    function update(d) {
      last = d; const s = d.settings;
      pan.externalPause = performance.now() + Math.max(0, Math.min(2000, d.windowZoomPauseMs || 0));
      time.textContent = d.time; time.style.display = d.showClock === false ? 'none' : 'block'; date.textContent = d.date;
      date.style.display = d.showDate ? 'block' : 'none';
      time.style.fontWeight = date.style.fontWeight = s.bold ? '700' : '400';
      document.documentElement.lang = d.locale;
      background.style.backgroundImage = d.backgroundUrl ? 'url("' + d.backgroundUrl + '")' : 'none';
      shade.style.opacity = d.backgroundUrl ? s.dim / 100 : 0;
      if (imageUrl !== d.backgroundUrl) {
        imageUrl = d.backgroundUrl; image = null; pan.reset();
        if (imageUrl) {
          const wanted = imageUrl, next = new Image();
          next.onload = () => { if (imageUrl === wanted) { image = next; refreshMotion(); } };
          next.src = wanted;
        }
      }
      refreshMotion();
      if (fontUrl !== d.fontUrl) {
        fontUrl = d.fontUrl;
        if (customFont) { document.fonts.delete(customFont); customFont = null; }
        if (fontUrl) {
          const wanted = fontUrl;
          const f = new FontFace('UserFont', 'url("' + fontUrl + '")');
          f.load().then(loaded => { if (fontUrl !== wanted) return; customFont = loaded; document.fonts.add(loaded); update(last); }).catch(() => {});
        }
      }
      document.body.style.fontFamily = fontUrl && customFont ? 'UserFont' : (s.font === 'sans' ? 'sans-serif' : s.font);
      fit(time, s.timeSize, s.timeX, s.timeY);
      if (d.showDate) fit(date, s.dateSize, s.dateX, s.dateY);
    }
    window.addEventListener('miniscreen:update', e => update(e.detail));
    window.addEventListener('resize', () => { if (last) update(last); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (animation) cancelAnimationFrame(animation); animation = 0; pan.last = -1; } else refreshMotion(); });
    if (window.miniScreen) update(window.miniScreen);
  </script>
</body>
</html>
