plugins { id 'com.android.application' }
android {
    namespace 'com.miniscreen.takeover'
    compileSdk 35
    defaultConfig {
        applicationId 'com.miniscreen.takeover'
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName '0.5.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

// Required for Profile.setCrossOriginIsolatedAllowlist; stable 1.17 lacks this API.
dependencies { implementation 'androidx.webkit:webkit:1.18.0-alpha02' }
