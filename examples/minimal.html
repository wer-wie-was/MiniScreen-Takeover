<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniScreen · Minimal</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: var(--background-color, #000); overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh; font-family: monospace; }
  #clock { font-size: 18vw; color: var(--time-color, #63e6dc); }
  #date { font-size: 6vw; color: var(--date-color, #c7d0df); max-width: 96vw; text-align: center; overflow-wrap: anywhere; }
</style>
<div id="clock">--:--</div><div id="date"></div>
<script>
  function update(d) {
    document.getElementById('clock').textContent = d.time;
    document.getElementById('date').textContent = d.showDate ? d.date : '';
  }
  window.addEventListener('miniscreen:update', e => update(e.detail));
  if (window.miniScreen) update(window.miniScreen);
</script>
</html>
