<!doctype html>
<html lang="de">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniScreen Notification Clock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}#background{position:absolute;inset:0;background-position:center;background-size:cover}#clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}#date{margin-top:8px}#notification{position:absolute;transform:translate(-50%,-50%);padding:6px;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}#notification[hidden]{display:none}#icon{flex:none;object-fit:contain}#message{min-width:0;width:100%;overflow:hidden;text-align:center}#text{display:block}#message.scrolling #text{white-space:nowrap;width:max-content;animation:run var(--duration,12s) linear infinite}@keyframes run{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
<div id="background"></div><div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="notification" hidden><img id="icon" alt=""><div id="message"><span id="text"></span></div></div>
<script>
const nodes=Object.fromEntries(['background','clock','time','date','notification','icon','message','text'].map(id=>[id,document.getElementById(id)]));let signature='',fontUrl='';
window.addEventListener('miniscreen:update',async({detail:d})=>{
 const factor=Math.min(d.cssWidth,d.cssHeight)/340,s=d.tickerSettings,n=d.notification;
 nodes.background.style.backgroundImage=d.backgroundUrl?`url("${d.backgroundUrl}")`:'none';nodes.background.style.opacity=1-d.settings.dim/100;
 nodes.time.hidden=d.showClock===false;nodes.date.hidden=!d.showDate;nodes.time.textContent=d.time;nodes.time.style.fontSize=d.settings.timeSize*factor+'px';nodes.time.style.color=d.settings.timeColor;
 nodes.date.textContent=d.date;nodes.date.style.fontSize=d.settings.dateSize*factor+'px';nodes.date.style.color=d.settings.dateColor;
 nodes.clock.style.opacity=n?(s.clockMode===1?.25:s.clockMode===2?0:1):1;
 nodes.notification.hidden=!n;nodes.text.textContent=n?n.text:'';
 if(!n){nodes.icon.removeAttribute('src');signature='';return;}
 nodes.notification.style.left=s.x+'%';nodes.notification.style.top=s.y+'%';nodes.notification.style.width=s.width+'%';
 const c=s.background;nodes.notification.style.backgroundColor=`rgba(${parseInt(c.slice(1,3),16)},${parseInt(c.slice(3,5),16)},${parseInt(c.slice(5,7),16)},${s.opacity/100})`;
 nodes.notification.style.color=s.color;nodes.notification.style.fontSize=s.fontSize*factor+'px';nodes.notification.style.fontWeight=s.bold?'bold':'normal';
 nodes.icon.hidden=!s.icon;nodes.icon.style.width=nodes.icon.style.height=s.iconSize*factor+'px';if(nodes.icon.getAttribute('src')!==n.iconUrl)nodes.icon.src=n.iconUrl;
 nodes.message.classList.toggle('scrolling',s.scroll);nodes.text.style.display=s.scroll?'block':'-webkit-box';nodes.text.style.webkitBoxOrient='vertical';nodes.text.style.webkitLineClamp=String(s.lines);
 nodes.notification.style.fontFamily=s.font==='profile'?d.settings.font:s.font;
 if(s.font==='profile'&&d.fontUrl&&fontUrl!==d.fontUrl){fontUrl=d.fontUrl;try{const f=new FontFace('TickerProfile',`url("${d.fontUrl}")`);await f.load();document.fonts.add(f);nodes.notification.style.fontFamily='TickerProfile';}catch(e){}}
 if(s.font==='profile'&&fontUrl===d.fontUrl&&fontUrl)nodes.notification.style.fontFamily='TickerProfile';
 const next=n.text+JSON.stringify(s);if(signature!==next){signature=next;nodes.text.style.animation='none';void nodes.text.offsetWidth;nodes.text.style.setProperty('--duration',Math.max(3,nodes.text.scrollWidth/(s.speed*factor))+'s');nodes.text.style.animation='';}
});
</script>
</html>
